<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Quest Tracker" />
<meta name="theme-color" content="#0e0c1a" />
<title>Quest Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0c1a;
    --surface: #171428;
    --surface2: #1f1b35;
    --border: rgba(180,160,255,0.12);
    --border2: rgba(180,160,255,0.22);
    --accent: #a78bfa;
    --accent2: #7c3aed;
    --accent-dim: rgba(167,139,250,0.15);
    --gold: #e2c97e;
    --gold-dim: rgba(226,201,126,0.15);
    --text: #f0ecff;
    --text2: #9d94c4;
    --text3: #5a5280;
    --danger: #f87171;
    --success: #6ee7b7;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    overflow-x: hidden;
  }

  body {
    padding-top: calc(var(--safe-top) + 16px);
    padding-bottom: calc(var(--safe-bottom) + 16px);
    padding-left: 16px;
    padding-right: 16px;
    max-width: 680px;
    margin: 0 auto;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(2px 2px at 70% 85%, rgba(167,139,250,0.3) 0%, transparent 100%),
      radial-gradient(2px 2px at 30% 10%, rgba(167,139,250,0.25) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .page { position: relative; z-index: 1; }

  .app-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 0.5px solid var(--border);
  }
  .app-header h1 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(226,201,126,0.3);
  }
  .app-header p {
    font-size: 13px;
    color: var(--text3);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }

  .level-panel {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 16px;
  }
  .level-badge { text-align: center; flex-shrink: 0; }
  .level-badge .lbl {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text3);
    display: block;
    margin-bottom: 2px;
  }
  .level-num {
    font-family: 'Cinzel', serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 30px rgba(226,201,126,0.4);
  }
  .level-num.pulse { animation: levelPulse 0.6s ease; }
  @keyframes levelPulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); color: #fff; text-shadow: 0 0 40px rgba(226,201,126,0.9); }
    100% { transform: scale(1); }
  }

  .xp-section { flex: 1; padding-bottom: 6px; }
  .xp-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 7px;
  }
  .xp-header .lbl {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text3);
  }
  .xp-counter { font-size: 13px; color: var(--accent); }
  .xp-track {
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
    border: 0.5px solid var(--border);
  }
  .xp-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 20px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    border-radius: 0 4px 4px 0;
  }

  .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 14px;
    border-top: 0.5px solid var(--border);
    flex-wrap: wrap;
  }
  .settings-row label { font-size: 13px; color: var(--text2); flex-shrink: 0; }

  /* XP-per-level manual setting disabled — now formula-based: 1000 + 50 * level */
  /*
  .settings-row input[type=number] {
    width: 80px;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 14px;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    outline: none;
  }
  .settings-row input[type=number]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(167,139,250,0.2);
  }
  */

  .btn-sm {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Crimson Pro', serif;
    transition: background 0.15s, color 0.15s;
  }
  .btn-sm:hover, .btn-sm:active { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  .btn-reset {
    margin-left: auto;
    color: var(--text3);
    border-color: var(--border);
  }
  .btn-reset:hover, .btn-reset:active { color: var(--danger); border-color: var(--danger); background: rgba(248,113,113,0.08); }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--gold);
    margin-bottom: 14px;
  }

  .quest-list { margin-bottom: 14px; }

  .quest-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .quest-row:last-child { border-bottom: none; }

  .quest-icon {
    width: 28px; height: 28px;
    background: var(--gold-dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .quest-name { flex: 1; font-size: 16px; color: var(--text); line-height: 1.3; }

  .quest-progress {
    font-size: 12px;
    color: var(--text3);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .quest-progress.done { color: var(--success); }

  .quest-xp-badge {
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-dim);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .btn-complete {
    background: var(--gold-dim);
    border: 0.5px solid rgba(226,201,126,0.25);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--gold);
    cursor: pointer;
    font-family: 'Crimson Pro', serif;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .btn-complete:hover, .btn-complete:active { background: rgba(226,201,126,0.25); }

  .btn-progress {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Crimson Pro', serif;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .btn-progress:hover, .btn-progress:active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

  .btn-del {
    background: transparent;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .btn-del:hover, .btn-del:active { color: var(--danger); }

  .empty-state {
    text-align: center;
    font-style: italic;
    color: var(--text3);
    font-size: 15px;
    padding: 16px 0;
  }

  /* Add quest form */
  .add-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-form input {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 16px;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    outline: none;
  }
  .add-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(167,139,250,0.2);
  }
  .add-form input::placeholder { color: var(--text3); }
  .input-name { flex: 1; min-width: 144px; }
  .input-xp { width: 80px; }
  .input-parts { width: 70px; }
  .btn-add {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 400;
    color: var(--accent);
    cursor: pointer;
    font-family: 'Crimson Pro', serif;
    transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btn-add:hover { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  .btn-add:active { transform: scale(0.97); }

  .toast {
    position: fixed;
    top: calc(var(--safe-top) + 20px);
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--gold);
    color: #1a1200;
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 12px 24px;
    border-radius: 30px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="page">

  <div class="app-header">
    <h1>⚔ Quest Tracker</h1>
    <p>Record your deeds. Claim your power.</p>
  </div>

  <div class="card">
    <div class="level-panel">
      <div class="level-badge">
        <span class="lbl">Power Level</span>
        <div class="level-num" id="level-display">1</div>
      </div>
      <div class="xp-section">
        <div class="xp-header">
          <span class="lbl">Experience</span>
          <span class="xp-counter" id="xp-label">0 / 1050 XP</span>
        </div>
        <div class="xp-track">
          <div class="xp-fill" id="xp-bar" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div class="settings-row">
      <span id="next-level-label" style="font-size:13px; color:var(--text2);"></span>
      <button class="btn-sm" id="sync-btn" onclick="syncToWidget()">⚡ Sync Widget</button>
      <button class="btn-sm btn-reset" onclick="resetAll()">Reset all</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Active Quests</div>
    <div class="quest-list" id="quest-list"></div>
    <div class="add-form">
      <input class="input-name" type="text" id="quest-name-input" placeholder="Quest name…" autocomplete="off" />
      <input class="input-xp" type="number" id="quest-xp-input" placeholder="XP" min="1" />
      <input class="input-parts" type="number" id="quest-parts-input" placeholder="Parts" min="1" value="1" title="Number of parts" />
      <button class="btn-add" onclick="addQuest()">+ Add</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const ICONS = ['⚔','🗡','🛡','🏹','🔮','📜','💀','🐉','🧙','🗺'];
let state = { level: 1, xp: 0, quests: [] };

// XP required to level up FROM a given level: 1000 + 50 * level
function xpForLevel(level) { return 1000 + 50 * level; }

function save() { try { localStorage.setItem('rpg-state-v2', JSON.stringify(state)); } catch(e) {} }
function load() {
  try {
    const d = localStorage.getItem('rpg-state-v2');
    if (d) state = JSON.parse(d);
  } catch(e) {}
  render();
}

function render() {
  const needed = xpForLevel(state.level);
  document.getElementById('level-display').textContent = state.level;
  const pct = Math.min(100, Math.round(state.xp / needed * 100));
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('xp-label').textContent = state.xp + ' / ' + needed + ' XP';
  document.getElementById('next-level-label').textContent =
    'Next level: ' + needed + ' XP  (lvl ' + state.level + ' → ' + (state.level + 1) + ')';

  const list = document.getElementById('quest-list');
  if (!state.quests.length) {
    list.innerHTML = '<div class="empty-state">No active quests — venture forth and add one</div>';
    return;
  }
  list.innerHTML = state.quests.map((q, i) => {
    const isMulti = q.parts > 1;
    const done = q.progress >= q.parts;
    const progressLabel = isMulti
      ? `<span class="quest-progress${done ? ' done' : ''}">${q.progress}/${q.parts}</span>`
      : '';
    const actionBtn = done || !isMulti
      ? `<button class="btn-complete" onclick="completeQuest(${i})">✓ Complete</button>`
      : `<button class="btn-progress" onclick="incrementQuest(${i})">+ Progress</button>`;
    return `
      <div class="quest-row">
        <div class="quest-icon">${q.icon}</div>
        <span class="quest-name">${escHtml(q.name)}</span>
        ${progressLabel}
        <span class="quest-xp-badge">+${q.xp} XP</span>
        ${actionBtn}
        <button class="btn-del" onclick="deleteQuest(${i})" aria-label="Delete">✕</button>
      </div>
    `;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addXp(amount) {
  let leveled = false;
  state.xp += amount;
  while (state.xp >= xpForLevel(state.level)) {
    state.xp -= xpForLevel(state.level);
    state.level += 1;
    leveled = true;
  }
  if (leveled) {
    const el = document.getElementById('level-display');
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
    showToast('Level Up! Power ' + state.level);
    setTimeout(() => el.classList.remove('pulse'), 700);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function incrementQuest(i) {
  const q = state.quests[i];
  if (q.progress < q.parts) q.progress += 1;
  save(); render();
}

function completeQuest(i) {
  const q = state.quests[i];
  addXp(q.xp);
  state.quests.splice(i, 1);
  save(); render();
}

function deleteQuest(i) {
  state.quests.splice(i, 1);
  save(); render();
}

function addQuest() {
  const name = document.getElementById('quest-name-input').value.trim();
  const xp = parseInt(document.getElementById('quest-xp-input').value);
  const parts = Math.max(1, parseInt(document.getElementById('quest-parts-input').value) || 1);
  if (!name || !xp || xp < 1) return;
  const icon = ICONS[Math.floor(Math.random() * ICONS.length)];
  state.quests.push({ name, xp, icon, parts, progress: 0 });
  document.getElementById('quest-name-input').value = '';
  document.getElementById('quest-xp-input').value = '';
  document.getElementById('quest-parts-input').value = '1';
  save(); render();
  document.getElementById('quest-name-input').focus();
}

function resetAll() {
  if (!confirm('Reset level, XP, and all quests?')) return;
  state = { level: 1, xp: 0, quests: [] };
  save(); render();
}

function buildPayload() {
  const needed = xpForLevel(state.level);
  return {
    level: state.level,
    xp: state.xp,
    xpNeeded: needed,
    xpPercent: Math.min(100, Math.round(state.xp / needed * 100)),
    quests: state.quests.map(q => ({
      name: q.name,
      xp: q.xp,
      parts: q.parts,
      progress: q.progress,
      done: q.progress >= q.parts
    })),
    exportedAt: new Date().toISOString()
  };
}

async function syncToWidget() {
  const btn = document.getElementById('sync-btn');
  const payload = JSON.stringify(buildPayload(), null, 2);
  try {
    await navigator.clipboard.writeText(payload);
    // Flash button to confirm copy
    btn.textContent = '✓ Copied!';
    btn.style.color = 'var(--success)';
    btn.style.borderColor = 'var(--success)';
    setTimeout(() => {
      btn.textContent = '⚡ Sync Widget';
      btn.style.color = '';
      btn.style.borderColor = '';
      // Open Shortcuts after brief delay so clipboard is ready
      window.location.href = 'shortcuts://run-shortcut?name=QuestTrackerSync';
    }, 400);
  } catch (e) {
    // Clipboard API may need a user gesture on some iOS versions — fallback alert
    alert('Copy this JSON manually:\n\n' + payload);
  }
}

document.getElementById('quest-name-input').addEventListener('keydown', e => { if (e.key === 'Enter') addQuest(); });

load();
</script>
</body>
</html>
